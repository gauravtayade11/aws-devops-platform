apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-devops-app
  template:
    metadata:
      labels:
        app: aws-devops-app
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
