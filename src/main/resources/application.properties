spring.application.name=aws-devops-platform

# Load the RDS secret from AWS Secrets Manager at startup.
# Expected secret JSON keys (RDS-generated format): username, password, host, port, dbname
spring.config.import=aws-secretsmanager:${DB_SECRET_NAME:aws-devops/rds}
spring.cloud.aws.region.static=${AWS_REGION:ap-southeast-2}

spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}
spring.datasource.username=${username}
spring.datasource.password=${password}
